<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Meta Ads</title>
<style>
  :root {
    --surface-1: #fcfcfb;
    --page: #f9f9f7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --muted: #898781;
    --gridline: #e1e0d9;
    --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6;
    --series-2: #1baf7a;
    --series-3: #eda100;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-1: #1a1a19;
      --page: #0d0d0d;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --muted: #898781;
      --gridline: #2c2c2a;
      --border: rgba(255,255,255,0.10);
      --series-1: #3987e5;
      --series-2: #199e70;
      --series-3: #c98500;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page);
    color: var(--text-primary);
  }
  header {
    padding: 24px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  h1 { font-size: 20px; margin: 0; }
  #status { font-size: 13px; color: var(--muted); }
  button#refresh-btn {
    background: var(--series-1);
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
  }
  .tabs {
    display: flex;
    gap: 4px;
    padding: 0 32px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    padding: 10px 16px;
    font-size: 14px;
    color: var(--text-secondary);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    user-select: none;
  }
  .tab.active {
    color: var(--text-primary);
    border-bottom-color: var(--series-1);
    font-weight: 600;
  }
  main { padding: 24px 32px 48px; }
  #kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat-tile {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .stat-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .stat-value {
    font-size: 22px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .charts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
    margin-bottom: 28px;
  }
  .chart-card {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
  }
  .chart-card h3 { margin: 0 0 12px; font-size: 14px; color: var(--text-secondary); }
  .chart-card canvas { max-height: 220px; }
  #table-wrap {
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow-x: auto;
  }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 10px 14px; text-align: left; white-space: nowrap; }
  th {
    color: var(--muted);
    font-weight: 500;
    border-bottom: 1px solid var(--gridline);
  }
  td { border-bottom: 1px solid var(--gridline); }
  td.num { font-variant-numeric: tabular-nums; text-align: right; }
  th:has(+ th.num), th.num { text-align: right; }
  #empty-state, #error-state {
    display: none;
    background: var(--surface-1);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 32px;
    text-align: center;
    color: var(--text-secondary);
  }
  #error-state { color: #d03b3b; display: none; }
</style>
</head>
<body>
<header>
  <h1>Dashboard Meta Ads</h1>
  <div style="display:flex; align-items:center; gap:16px;">
    <span id="status"></span>
    <button id="refresh-btn">Atualizar</button>
  </div>
</header>

<nav class="tabs">
  <div class="tab active" data-level="campaign">Campanhas</div>
  <div class="tab" data-level="adset">Conjuntos de Anúncio</div>
  <div class="tab" data-level="ad">Anúncios</div>
</nav>

<main>
  <div id="empty-state">Nenhum dado encontrado nesta aba ainda. Rode "Atualizar Dados Agora" no menu Meta Ads da planilha.</div>
  <div id="error-state"></div>

  <div id="dashboard-content">
    <div id="kpi-grid"></div>

    <div class="charts-grid">
      <div class="chart-card">
        <h3>Resultado por dia</h3>
        <canvas id="chart-resultado"></canvas>
      </div>
      <div class="chart-card">
        <h3>Custo por Resultado por dia</h3>
        <canvas id="chart-custo-resultado"></canvas>
      </div>
      <div class="chart-card">
        <h3>CPM por dia</h3>
        <canvas id="chart-cpm"></canvas>
      </div>
    </div>

    <div id="table-wrap"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
